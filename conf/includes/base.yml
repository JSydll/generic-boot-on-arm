header:
  version: 14

target:
  - secure-image-minimal
  - secure-update-bundle

distro: poky

defaults:
  repos:
    branch: walnascar

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    path: layers/bitbake
    branch: "2.12"
    layers:
      bitbake: excluded

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/oe-core
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-perl:
      meta-python:

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    path: layers/meta-security

  meta-secure-core:
    url: https://github.com/Wind-River/meta-secure-core.git
    path: layers/meta-secure-core
    layers:
      meta-secure-core-common:
      meta-signing-key:
      meta-efi-secure-boot:

  # Using fork of meta-arm until build issues in master are fixed
  meta-arm-contrib:
    url: https://github.com/JSydll/meta-arm-contrib
    branch: master-next
    path: layers/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    path: layers/meta-rauc

  meta-generic-boot:
    layers:
      meta-generic-boot:

local_conf_header:
  distro: |
    DISTRO_FEATURES:append = " rauc systemd overlayfs security "
    INIT_MANAGER = "systemd"

  versioning: |
    SOFTWARE_VERSION ??= "0.0"

  common-security: |
    # For now, keys are created in a top level directory - a productive setup would require
    # proper key provisioning and infrastructure.
    PKI_BASEPATH = "/repo/pki"

    # Secrets for OS image signing
    SBSIGN_KEYS_DIR   = "${PKI_BASEPATH}/os-images"
    
    # Secrets for update package signing
    RAUC_KEYRING_FILE = "${PKI_BASEPATH}/update-bundles/updates.ca.cert.pem"
    RAUC_KEY_FILE     = "${PKI_BASEPATH}/update-bundles/updates.key.pem"
    RAUC_CERT_FILE    = "${PKI_BASEPATH}/update-bundles/updates.cert.pem"
    
    # Integrity checking
    DM_VERITY_IMAGE = "secure-image-minimal"
    DM_VERITY_IMAGE_TYPE = "squashfs"
    IMAGE_CLASSES += "dm-verity-img"
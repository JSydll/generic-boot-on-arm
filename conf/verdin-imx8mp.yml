header:
  version: 14
  includes:
    - conf/includes/base.yml

machine: verdin-imx8mp

defaults:
  repos:
    # This is mostly required due to the layer compatibility of Toradex' layers
    # and the need to have at least the walnascar release (e.g. for uki.bbclass).
    branch: master

repos:
  bitbake:
    # master branches are on whinlatter so use corresponding bitbake version
    branch: "2.14"

  meta-arm-contrib:
    branch: master-next-whinlatter
  
  meta-freescale:
    url: https://github.com/Freescale/meta-freescale.git
    path: layers/meta-freescale

  meta-freescale-3rdparty:
    url: https://github.com/Freescale/meta-freescale-3rdparty.git
    path: layers/meta-freescale-3rdparty

  meta-toradex-nxp:
    url: https://git.toradex.com/cgit/meta-toradex-nxp.git
    path: layers/meta-toradex-nxp

  meta-toradex-bsp-common:
    url: https://git.toradex.com/cgit/meta-toradex-bsp-common.git
    path: layers/meta-toradex-bsp-common

  meta-security:
    layers:
      .:
      meta-tpm:

  # Using fork of meta-toradex-security until whinlatter is supported
  meta-toradex-security:
    url: https://github.com/JSydll/meta-toradex-security-contrib.git
    path: layers/meta-toradex-security
    branch: scarthgap-7.x.y-next

local_conf_header:
  device-config: |
    EMMC_BLOCK_DEV = "/dev/mmcblk2"

  imx-bsp: |
    ACCEPT_FSL_EULA = "1"

  toradex-bsp: |
    MACHINEOVERRIDES =. "use-mainline-bsp:"

    # Remove contents defined in the machine.conf
    IMAGE_CLASSES:remove = "image_type_tezi"
    IMAGE_FSTYPES:remove = "teziimg"
    IMAGE_BOOT_FILES:remove = "boot.scr-${MACHINE};boot.scr"
    WKS_FILE_DEPENDS:remove = " u-boot-default-script"

  verdin-imx8mp-security: |
    MACHINE_FEATURES:append = " optee efi uefi-secureboot"

    # ATTENTION: Mainline OP-TEE is painfully known not to work well with NXP SoCs
    PREFERRED_VERSION_optee-os = "4.6.0.imx"

    OPTEE_VARSTORE_SUPPLICANT = "edk2-firmware"
    OPTEE_VARSTORE_SUPPLICANT_BIN = "edk2-stmm.bin"

    # Activate BSP specific configuration as provided by meta-toradex-security.
    # Note that the recommended way is to inherit corresponding classes, but the configuration 
    # here should be as lean as possible. Of course, features like bootloader hardening will be
    # missing then.
    TDX_OPTEE_ENABLE = "1"
    TDX_OPTEE_FS_RPMB = "1"
    TDX_OPTEE_FS_RPMB_MODE = "development"

    # Boot container signing
    IMX_CST_BASEPATH = "${PKI_BASEPATH}/boot-containers"
    TDX_IMX_HAB_CST_BIN = "${IMX_CST_BASEPATH}/bin/cst"
    # Note: The NXP CST expects the keys directory next to the certs directory specified here
    TDX_IMX_HAB_CST_CERTS_DIR = "${IMX_CST_BASEPATH}/crts"
    # In key revocation scenarios, this would be incremented.
    TDX_IMX_HAB_CST_SRK_INDEX = "1"
    TDX_IMX_HAB_CST_CRYPTO = "rsa"
    TDX_IMX_HAB_CST_KEY_SIZE = "2048"
    TDX_IMX_HAB_CST_SRK_CA = "1"

    TDX_IMX_HAB_ENABLE = "1"

  no-network:
    PACKAGECONFIG:remove:pn-systemd = "networkd timesyncd nss-resolve resolved"

  versioning: |
    SOFTWARE_VERSION = "0.1"